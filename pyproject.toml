[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dept-similarity"
version = "0.1.0"
description = "Similarity computation for DEPT NMR spectra"
license = "MIT"
authors = [
    { name = "Enveda" },
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "fastparquet>=2026.5.0",
    "matplotlib-venn>=1.1.2",
    "numba>=0.65.1",
    "numpy>=1.23.0,<3",
    "pandas>=2.2.2,<3",
    "pre-commit>=4.6.0",
    "pyarrow>=19.0.0",
    "rdkit>=2026.3.2",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.13.0,<2",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "black>=26.3.1,<27",
    "ruff>=0.8.0,<1",
    "ipykernel>=6.29.5,<7",
    "pre-commit>=4.1.0,<5",
    "pytest>=9.0.0,<10",
    "nbconvert>=7.17.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["dept_similarity"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = ['e2e: marks tests as end-to-end (deselect with "-m "not e2e"")']
